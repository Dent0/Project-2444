<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Inter, Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Схема окна MiniUI по описанию из README</title>
  <rect width="960" height="560" rx="14" fill="#0D1631"/>
  <rect x="0.5" y="0.5" width="959" height="559" rx="14" fill="none" stroke="#1E3762"/>
  <!-- title bar -->
  <rect x="0" y="0" width="960" height="40" rx="14" fill="#14224A"/>
  <rect x="0" y="26" width="960" height="14" fill="#14224A"/>
  <circle cx="22" cy="20" r="6" fill="#FF5CA8"/><circle cx="42" cy="20" r="6" fill="#FFB547"/><circle cx="62" cy="20" r="6" fill="#3FD0FF"/>
  <text x="480" y="25" fill="#C9D4F0" font-size="14" text-anchor="middle">MiniUI — локальный ассистент студента</text>
  <!-- tabs -->
  <rect x="20" y="54" width="210" height="32" rx="8" fill="#3FD0FF" fill-opacity="0.18" stroke="#3FD0FF"/>
  <text x="125" y="75" fill="#FFFFFF" font-size="14" text-anchor="middle" font-weight="600">Ассистент студента</text>
  <rect x="240" y="54" width="250" height="32" rx="8" fill="none" stroke="#2E5A92"/>
  <text x="365" y="75" fill="#A7B4D4" font-size="14" text-anchor="middle">Batch-прогоны и бенчмарк</text>
  <!-- left panel -->
  <rect x="20" y="100" width="280" height="440" rx="10" fill="#0A1228" stroke="#1E3762"/>
  <text x="36" y="126" fill="#A7B4D4" font-size="12">МОДЕЛЬ (Ollama / HF-кэш)</text>
  <rect x="36" y="134" width="248" height="30" rx="6" fill="#14224A" stroke="#2E5A92"/>
  <text x="48" y="154" fill="#EAF0FF" font-size="13" font-family="DejaVu Sans Mono, monospace">qwen2.5:7b-instruct ▾</text>
  <text x="36" y="190" fill="#A7B4D4" font-size="12">КАТЕГОРИЯ ЗАДАЧИ</text>
  <g font-size="13" fill="#EAF0FF">
    <rect x="36" y="198" width="248" height="28" rx="6" fill="#FF5CA8" fill-opacity="0.16" stroke="#FF5CA8"/><text x="48" y="217">Программирование и отладка</text>
    <rect x="36" y="232" width="248" height="28" rx="6" fill="none" stroke="#2E5A92"/><text x="48" y="251">Математика и алгоритмы</text>
    <rect x="36" y="266" width="248" height="28" rx="6" fill="none" stroke="#2E5A92"/><text x="48" y="285">Анализ данных и отчётность</text>
    <rect x="36" y="300" width="248" height="28" rx="6" fill="none" stroke="#2E5A92"/><text x="48" y="319">Теория и конспекты</text>
    <rect x="36" y="334" width="248" height="28" rx="6" fill="none" stroke="#2E5A92"/><text x="48" y="353">Свободный диалог</text>
  </g>
  <text x="36" y="392" fill="#A7B4D4" font-size="12">ПАРАМЕТРЫ</text>
  <g font-size="13" fill="#C9D4F0">
    <text x="36" y="416">temperature</text><rect x="150" y="403" width="134" height="20" rx="4" fill="#14224A" stroke="#2E5A92"/><text x="160" y="418" fill="#EAF0FF">0.2</text>
    <text x="36" y="444">seed</text><rect x="150" y="431" width="134" height="20" rx="4" fill="#14224A" stroke="#2E5A92"/><text x="160" y="446" fill="#EAF0FF">42</text>
    <text x="36" y="472">max_tokens</text><rect x="150" y="459" width="134" height="20" rx="4" fill="#14224A" stroke="#2E5A92"/><text x="160" y="474" fill="#EAF0FF">500</text>
  </g>
  <rect x="36" y="496" width="118" height="30" rx="6" fill="none" stroke="#3FD0FF"/><text x="95" y="516" fill="#8FE4FF" font-size="13" text-anchor="middle">Экспорт PDF</text>
  <rect x="166" y="496" width="118" height="30" rx="6" fill="none" stroke="#3FD0FF"/><text x="225" y="516" fill="#8FE4FF" font-size="13" text-anchor="middle">Экспорт MD</text>
  <!-- chat -->
  <rect x="316" y="100" width="624" height="370" rx="10" fill="#0A1228" stroke="#1E3762"/>
  <rect x="520" y="116" width="404" height="52" rx="10" fill="#FF5CA8" fill-opacity="0.14" stroke="#FF5CA8" stroke-opacity="0.6"/>
  <text x="536" y="138" fill="#FFFFFF" font-size="13">Найди ошибку: функция возвращает</text>
  <text x="536" y="156" fill="#FFFFFF" font-size="13">неверную сумму для пустого списка</text>
  <rect x="332" y="182" width="520" height="270" rx="10" fill="#14224A" stroke="#2E5A92"/>
  <text x="348" y="206" fill="#FFFFFF" font-size="14" font-weight="700">Причина</text>
  <text x="348" y="228" fill="#C9D4F0" font-size="13">Начальное значение аккумулятора не задано, поэтому…</text>
  <text x="348" y="258" fill="#FFFFFF" font-size="14" font-weight="700">Исправленный код</text>
  <rect x="348" y="268" width="488" height="96" rx="6" fill="#070D1F"/>
  <g font-family="DejaVu Sans Mono, monospace" font-size="12" xml:space="preserve">
    <text x="360" y="290" fill="#FF9CCB">def <tspan fill="#8FE4FF">total</tspan><tspan fill="#EAF0FF">(xs):</tspan></text>
    <text x="360" y="310" fill="#EAF0FF">    s = 0</text>
    <text x="360" y="330" fill="#EAF0FF">    for x in xs: s += x</text>
    <text x="360" y="350" fill="#FF9CCB">    return <tspan fill="#EAF0FF">s</tspan></text>
  </g>
  <text x="348" y="392" fill="#A7B4D4" font-size="12">потоковый Markdown-вывод ▍</text>
  <g font-size="12" fill="#8FE4FF" font-family="DejaVu Sans Mono, monospace">
    <rect x="348" y="410" width="104" height="24" rx="12" fill="none" stroke="#3FD0FF" stroke-opacity="0.6"/><text x="400" y="426" text-anchor="middle">TTFT</text>
    <rect x="460" y="410" width="104" height="24" rx="12" fill="none" stroke="#3FD0FF" stroke-opacity="0.6"/><text x="512" y="426" text-anchor="middle">TPS</text>
    <rect x="572" y="410" width="132" height="24" rx="12" fill="none" stroke="#3FD0FF" stroke-opacity="0.6"/><text x="638" y="426" text-anchor="middle">лог в JSON</text>
  </g>
  <!-- input -->
  <rect x="316" y="482" width="530" height="58" rx="10" fill="#0A1228" stroke="#2E5A92"/>
  <text x="332" y="516" fill="#6F7A99" font-size="14">Введите задачу или вставьте код…</text>
  <rect x="856" y="482" width="84" height="58" rx="10" fill="#FF5CA8"/>
  <text x="898" y="516" fill="#070D1F" font-size="14" font-weight="700" text-anchor="middle">Отправить</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
